name: tekcert

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tekcert
      POSTGRES_PASSWORD: tekcert
      POSTGRES_DB: tekcert
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tekcert -d tekcert']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email sent in development: inbox UI at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible storage for profile photos (Amazon S3 on AWS). It creates the bucket at start
  # and keeps files in the volume. S3Mock instead of MinIO, which no longer publishes images (ADR-016).
  storage:
    image: adobe/s3mock:4.11.0
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tekcert-avatars
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    ports:
      - '9090:9090'
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
