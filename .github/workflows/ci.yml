name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The monorepo lives in app/; the repository root also holds infra docs.
    working-directory: app

jobs:
  ci:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tekcert
          POSTGRES_PASSWORD: tekcert
          POSTGRES_DB: tekcert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tekcert -d tekcert_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://tekcert:tekcert@localhost:5432/tekcert_test
      DATABASE_URL: postgresql://tekcert:tekcert@localhost:5432/tekcert_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm test:api

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/e2e/playwright-report
          retention-days: 7
