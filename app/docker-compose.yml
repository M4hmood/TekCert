name: tekcert

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tekcert
      POSTGRES_PASSWORD: tekcert
      POSTGRES_DB: tekcert
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tekcert -d tekcert']
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email sent in development: inbox UI at http://localhost:8025
  mail:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
